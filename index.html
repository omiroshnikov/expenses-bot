<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>расход</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, system-ui, sans-serif; width: 100%; padding: 12px 14px; margin: 0; background: #fff; color: #111; box-sizing: border-box; }
    .container { width: 100%; margin: 0; }
    h2 { margin: 2px 0 8px; font-size: 19px; line-height: 1.25; font-weight: 700; }
    label { display: block; margin: 8px 0 4px; opacity: .95; font-size: 16px; font-weight: 600; }
    input, select { width: 100%; min-height: 46px; padding: 10px 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #d9d9d9; border-radius: 10px; background: #fff; }
    .dateRow { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .dateRow #date { flex: 1; }
    .quickDateBtn { min-height: 40px; padding: 10px; font-size: 14px; border-radius: 10px; border: 1px solid #d9d9d9; background: #f6f7f9; touch-action: manipulation; white-space: nowrap; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
    .pill { border: 1px solid #d9d9d9; border-radius: 999px; padding: 7px 10px; min-height: 36px; background: #f6f7f9; font-size: 14px; cursor: pointer; touch-action: manipulation; box-sizing: border-box; }
    .pill.active { background: #2aabee; border-color: #2aabee; color: #fff; }
    .pill:disabled { opacity: 0.45; cursor: default; }
    .hidden { display: none; }
    label.commonLabel { font-size: 16px; margin-top: 6px; font-weight: 600; }
    #date { min-height: 46px; padding: 10px 12px; font-size: 16px; }
    #submitBtn { width: 100%; margin-top: 10px; min-height: 0; padding: 11px 12px; font-size: 16px; border: 0; border-radius: 12px; background: #2aabee; color: #fff; font-weight: 600; touch-action: manipulation; display: block; }
    #submitBtn[disabled] { opacity: .7; cursor: not-allowed; }
    .hint { margin-top: 8px; font-size: 14px; min-height: 18px; opacity: .9; }
  </style>
</head>
<body>
  <div class="container">
    <h2>расход</h2>

    <label>дата</label>
    <div class="dateRow">
      <input id="date" type="date">
      <button class="quickDateBtn" type="button" id="today">сегодня</button>
      <button class="quickDateBtn" type="button" id="yesterday">вчера</button>
    </div>

    <label>категория *</label>
    <div id="categoryPills" class="pills"></div>
    <select id="category" required>
      <option value="">выбери</option>
    </select>

    <label>наименование *</label>
    <input id="name" placeholder="кофе">
    <select id="nameLookup" class="hidden">
      <option value="">выбери</option>
    </select>
    <input id="nameOther" class="hidden" placeholder="уточнение для прочее (необязательно)">

    <label>сумма *</label>
    <input id="amount" inputmode="decimal" placeholder="460">

    <label class="commonLabel">общий / Олег / Женя</label>
    <div id="commonPills" class="pills"></div>

    <label>откуда платил</label>
    <div id="payFromPills" class="pills"></div>
    <select id="payFrom">
      <option value="">выбери</option>
    </select>

    <label>примечание</label>
    <input id="note" placeholder="">

    <button id="submitBtn" type="button">отправить</button>
    <div id="hint" class="hint"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const params = new URLSearchParams(location.search);
    const gasUrl = params.get("gas_url") || "";
    const accessKey = params.get("k") || "";
    let isSubmitting = false;
    let selectedCategory = "";
    let selectedPayFrom = "";
    let nameLookupByCategory = {};
    let commonByCategory = {};
    let selectedCommon = "Олег";
    let commonLocked = false;

    function iso(d) {
      const z = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
    }

    function normalizeAmount(s) {
      return String(s || "").trim().replace(/\s/g, "").replace(",", ".");
    }

    function setHint(text) {
      document.getElementById("hint").textContent = text;
    }

    function setSubmittingState(locked) {
      isSubmitting = locked;
      const btn = document.getElementById("submitBtn");
      btn.disabled = locked;
      btn.textContent = locked ? "отправляю..." : "отправить";
    }

    function fillSelect(id, values, placeholder) {
      const sel = document.getElementById(id);
      sel.innerHTML = "";
      const base = document.createElement("option");
      base.value = "";
      base.textContent = placeholder || "выбери";
      sel.appendChild(base);
      values.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
    }

    function renderPills(containerId, values, activeValue, onPick) {
      const el = document.getElementById(containerId);
      el.innerHTML = "";
      values.forEach((v) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pill${activeValue === v ? " active" : ""}`;
        btn.textContent = v;
        btn.onclick = () => onPick(v);
        el.appendChild(btn);
      });
    }

    function getSelectedCategory() {
      return selectedCategory || document.getElementById("category").value.trim();
    }

    function getSelectedPayFrom() {
      return selectedPayFrom || document.getElementById("payFrom").value.trim();
    }

    function techNorm(s) {
      return String(s || "").trim().toLowerCase();
    }

    function applyCategoryAutofill(categoryValue) {
      const nameEl = document.getElementById("name");
      if (!nameEl.value.trim() && categoryValue) {
        nameEl.value = categoryValue;
      }
    }

    /** Сервер отдаёт commonByCategory с ключами normTechKey (lowerCase), значение — сырой текст из «общ_индив» (может быть пусто). */
    function commonMappedForCategory(categoryValue) {
      const k = techNorm(categoryValue);
      if (!k) return "";
      const v = commonByCategory[k];
      return v !== undefined && v !== null ? String(v).trim() : "";
    }

    function interpretTechCommonRaw(raw) {
      const n = techNorm(raw);
      if (!n) return null;
      if (n === "общ" || n === "общий") return { value: "общий", lock: true };
      if (n === "олег") return { value: "Олег", lock: true };
      if (n === "женя") return { value: "Женя", lock: true };
      return null;
    }

    function defaultCommonByUserId() {
      return getUserId() === "188357399" ? "Женя" : "Олег";
    }

    function renderCommonPills() {
      const el = document.getElementById("commonPills");
      el.innerHTML = "";
      ["общий", "Олег", "Женя"].forEach((v) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pill${selectedCommon === v ? " active" : ""}`;
        const active = selectedCommon === v;
        btn.disabled = commonLocked && !active;
        btn.textContent = v;
        btn.onclick = () => {
          if (commonLocked || btn.disabled) return;
          selectedCommon = v;
          renderCommonPills();
        };
        el.appendChild(btn);
      });
    }

    function getCommonIndivSelected() {
      return selectedCommon;
    }

    function applyCommonByCategory(categoryValue) {
      const parsed = interpretTechCommonRaw(commonMappedForCategory(categoryValue));
      if (parsed) {
        selectedCommon = parsed.value;
        commonLocked = true;
      } else {
        commonLocked = false;
        const ok = ["общий", "Олег", "Женя"];
        const noCat = !String(categoryValue || "").trim();
        if (noCat || !ok.includes(selectedCommon)) selectedCommon = defaultCommonByUserId();
      }
      renderCommonPills();
    }

    /** Субстатьи по «Статья_main» (см. GAS). Ключи — lowerCase нормализация категории из списка «Статья». */
    function nameOptionsForCategory(categoryValue) {
      const k = techNorm(categoryValue);
      if (!k) return [];
      const direct = nameLookupByCategory[k];
      if (Array.isArray(direct) && direct.length) return direct;
      const legacy = Object.keys(nameLookupByCategory).find((x) => techNorm(x) === k);
      return Array.isArray(nameLookupByCategory[legacy]) ? nameLookupByCategory[legacy] : [];
    }

    function applyNameLookupByCategory(categoryValue) {
      const options = nameOptionsForCategory(categoryValue);
      const nameInput = document.getElementById("name");
      const lookup = document.getElementById("nameLookup");
      const other = document.getElementById("nameOther");
      if (!options.length) {
        lookup.classList.add("hidden");
        other.classList.add("hidden");
        nameInput.classList.remove("hidden");
        applyCategoryAutofill(categoryValue);
        return;
      }
      nameInput.value = "";
      fillSelect("nameLookup", options, "выбери");
      lookup.classList.remove("hidden");
      nameInput.classList.add("hidden");
      other.classList.add("hidden");
      lookup.value = "";
      other.value = "";
      lookup.onchange = () => {
        if (lookup.value === "прочее") {
          other.classList.remove("hidden");
        } else {
          other.classList.add("hidden");
        }
      };
    }

    function getNameValue() {
      const nameInput = document.getElementById("name");
      const lookup = document.getElementById("nameLookup");
      const other = document.getElementById("nameOther");
      if (!lookup.classList.contains("hidden")) {
        const pick = String(lookup.value || "").trim();
        if (pick !== "прочее") return pick;
        const manual = String(other.value || "").trim();
        return manual || "прочее";
      }
      return String(nameInput.value || "").trim();
    }

    function getUserId() {
      const initDataUser = tg?.initDataUnsafe?.user || {};
      return String(initDataUser.id || "");
    }

    function loadConfigJsonp() {
      return new Promise((resolve, reject) => {
        const cb = `cfg_cb_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const uid = encodeURIComponent(getUserId());
        const src = `${gasUrl}?mode=config&k=${encodeURIComponent(accessKey)}&uid=${uid}&callback=${cb}`;
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onerror = () => reject(new Error("config load failed"));
        window[cb] = (data) => {
          try { resolve(data || {}); } finally {
            delete window[cb];
            s.remove();
          }
        };
        document.head.appendChild(s);
      });
    }

    async function initDynamicOptions() {
      if (!gasUrl || !accessKey) return;
      try {
        const cfg = await loadConfigJsonp();
        const categories = Array.isArray(cfg.categories) ? cfg.categories : [];
        const payFrom = Array.isArray(cfg.payFrom) ? cfg.payFrom : [];
        const defaultPayFrom = String(cfg.defaultPayFrom || "");
        nameLookupByCategory = cfg.nameLookupByCategory || {};
        commonByCategory = cfg.commonByCategory || {};

        const catPills = categories.slice(0, 6);
        const catRest = categories.slice(6);
        const redrawCategoryPills = () => {
          renderPills("categoryPills", catPills, selectedCategory, (v) => {
            selectedCategory = v;
            document.getElementById("category").value = "";
            applyNameLookupByCategory(v);
            applyCommonByCategory(v);
            redrawCategoryPills();
          });
        };
        fillSelect("category", catRest, catRest.length ? "другие категории" : "выбери");
        redrawCategoryPills();
        document.getElementById("category").onchange = (e) => {
          selectedCategory = "";
          const v = String(e.target.value || "").trim();
          applyNameLookupByCategory(v);
          applyCommonByCategory(v);
          redrawCategoryPills();
        };

        const payPills = payFrom.slice(0, 4);
        const payRest = payFrom.slice(4);
        const redrawPayPills = () => {
          renderPills("payFromPills", payPills, selectedPayFrom, (v) => {
            selectedPayFrom = v;
            document.getElementById("payFrom").value = "";
            redrawPayPills();
          });
        };
        fillSelect("payFrom", payRest, payRest.length ? "другие источники" : "выбери");
        selectedPayFrom = defaultPayFrom || "";
        redrawPayPills();
        if (selectedPayFrom && !payPills.includes(selectedPayFrom)) {
          document.getElementById("payFrom").value = selectedPayFrom;
          selectedPayFrom = "";
        }
        document.getElementById("payFrom").onchange = () => {
          selectedPayFrom = "";
          redrawPayPills();
        };
        const cur = getSelectedCategory();
        applyNameLookupByCategory(cur);
        applyCommonByCategory(cur);
      } catch (_e) {
        setHint("не удалось загрузить техлист");
      }
    }

    function readTelegramMeta() {
      const initDataUser = tg?.initDataUnsafe?.user || {};
      const initDataChat = tg?.initDataUnsafe?.chat || {};
      return {
        tg_user: String(initDataUser.username || `${initDataUser.first_name || ""} ${initDataUser.last_name || ""}`.trim()),
        tg_user_id: String(initDataUser.id || ""),
        chat_id: String(initDataChat.id || initDataUser.id || ""),
        message_id: ""
      };
    }

    async function submit() {
      if (isSubmitting) return;
      if (!gasUrl || !accessKey) {
        setHint("ошибка конфигурации формы");
        return;
      }

      const name = getNameValue();
      const amount = normalizeAmount(document.getElementById("amount").value);
      const category = getSelectedCategory();
      const payFrom = getSelectedPayFrom();
      const commonIndiv = getCommonIndivSelected();

      if (!name) return setHint("введи наименование");
      if (!amount) return setHint("введи сумму");
      if (!category) return setHint("выбери категорию");
      if (!payFrom) return setHint("выбери откуда платил");

      const submitId = (window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`).toString();
      const payload = {
        k: accessKey,
        submit_id: submitId,
        date: document.getElementById("date").value || iso(new Date()),
        name,
        amount,
        category,
        payFrom,
        commonIndiv,
        note: document.getElementById("note").value.trim(),
        ...readTelegramMeta()
      };

      setSubmittingState(true);
      setHint("отправляю...");

      try {
        const body = new URLSearchParams({ payload: JSON.stringify(payload) });
        await fetch(gasUrl, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body,
          mode: "no-cors"
        });
        setTimeout(() => tg?.close?.(), 250);
      } catch (_e) {
        setSubmittingState(false);
        setHint("ошибка сети, попробуй ещё раз");
      }
    }

    document.getElementById("date").value = iso(new Date());
    document.getElementById("today").onclick = () => { document.getElementById("date").value = iso(new Date()); };
    document.getElementById("yesterday").onclick = () => {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      document.getElementById("date").value = iso(d);
    };
    document.getElementById("submitBtn").onclick = submit;
    renderCommonPills();
    initDynamicOptions();

    if (tg) {
      tg.ready();
      tg.expand();
      tg.MainButton.hide();
    }
  </script>
</body>
</html>
