<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>расход</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; padding: 14px; }
    label { display:block; margin: 10px 0 6px; opacity:.8; }
    input, select { width:100%; padding:12px; font-size:16px; box-sizing:border-box; }
    .row { display:flex; gap:10px; margin-top:10px; }
    .row button { width:50%; padding:12px; font-size:16px; }
    .hint { margin-top:10px; font-size:13px; opacity:.75; }
  </style>
</head>

<body>
  <h2>расход</h2>

  <label>дата</label>
  <input id="date" type="date" />

  <div class="row">
    <button type="button" id="today">сегодня</button>
    <button type="button" id="yesterday">вчера</button>
  </div>

  <label>наименование *</label>
  <input id="name" placeholder="кофе" />

  <label>сумма *</label>
  <input id="amount" inputmode="decimal" placeholder="460" />

  <label>категория *</label>
  <select id="category">
    <option value="">выбери</option>
    <option>кафе</option><option>продукты</option><option>спорт</option><option>красота/здоровье</option>
    <option>транспорт</option><option>развлечения</option><option>авто</option><option>подарки</option>
    <option>квартира</option><option>алименты</option><option>кредит</option><option>инвестиции</option>
    <option>прочее</option><option>тел. + инет + подписки</option><option>банк. комиссия</option><option>дети</option>
    <option>плутон</option><option>одежда</option><option>путешествия</option><option>отдал жене</option>
    <option>книги</option><option>ozon</option><option>обучение</option>
  </select>

  <label>откуда платил</label>
  <select id="payFrom">
    <option>сбер 7650</option>
    <option>сбер gold</option>
    <option>тинькофф</option>
    <option>ип рахматуллаев</option>
    <option>ип саяпина</option>
    <option>сбер ип урумчи</option>
    <option>счет сбер физ. лица</option>
    <option>сбер разные счета</option>
    <option>наличные</option>
  </select>

  <label>примечание</label>
  <input id="note" placeholder="" />

  <div class="hint" id="hint"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    const params = new URLSearchParams(location.search);
    const k = params.get("k") || "";

    function iso(d){
      const z = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
    }

    document.getElementById('date').value = iso(new Date());

    document.getElementById('today').onclick = () => {
      document.getElementById('date').value = iso(new Date());
    };

    document.getElementById('yesterday').onclick = () => {
      const d = new Date(); d.setDate(d.getDate()-1);
      document.getElementById('date').value = iso(d);
    };

    if (tg){
      tg.ready();
      tg.expand();
      tg.MainButton.setText("отправить");
      tg.MainButton.show();
      tg.MainButton.onClick(doSend);
    }

    function normalizeAmount(s){
      return String(s || "").trim().replace(/\s/g,'').replace(',','.');
    }

    async function doSend(){
      const name = document.getElementById('name').value.trim();
      const amount = normalizeAmount(document.getElementById('amount').value);
      const category = document.getElementById('category').value.trim();

      if (!name){
        document.getElementById('hint').textContent = "введи наименование";
        return;
      }
      if (!amount){
        document.getElementById('hint').textContent = "введи сумму";
        return;
      }
      if (!category){
        document.getElementById('hint').textContent = "выбери категорию";
        return;
      }

      const payload = {
        date: document.getElementById('date').value,
        name,
        amount,
        category,
        payFrom: document.getElementById('payFrom').value.trim(),
        note: document.getElementById('note').value.trim(),
        _mid: Date.now()
      };

      document.getElementById('hint').textContent = "отправляю...";
      try {
        const r = await fetch(`/submit?k=${encodeURIComponent(k)}`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        const j = await r.json().catch(() => ({}));

        if (!r.ok || !j.ok){
          document.getElementById('hint').textContent = "ошибка отправки";
          return;
        }

        // без "записано", просто закрываем
        setTimeout(() => tg?.close?.(), 200);
      } catch(e){
        document.getElementById('hint').textContent = "ошибка сети";
      }
    }
  </script>
</body>
</html>
